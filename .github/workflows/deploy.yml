name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: testing
        type: choice
        options:
          - development
          - testing
          - production

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop' || startsWith(github.event.workflow_run.head_branch, 'release/')))
    environment: ${{ github.event.inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production') || 'testing' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy with Vercel
        run: |
          set -eu
          ENVIRONMENT_NAME="${DEPLOY_ENVIRONMENT}"
          if [ "$ENVIRONMENT_NAME" = "production" ]; then
            VERCEL_ENVIRONMENT="production"
            PROD_FLAG="--prod"
          else
            VERCEL_ENVIRONMENT="preview"
            PROD_FLAG=""
          fi

          npx --yes vercel@latest pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build $PROD_FLAG --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN"
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production') || 'testing' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop' || startsWith(github.event.workflow_run.head_branch, 'release/')))
    environment: ${{ github.event.inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production') || 'testing' }}

    steps:
      - name: Trigger Render services
        run: |
          set -eu
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"

          curl --fail --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"

          if [ -n "${RENDER_WORKER_SERVICE_ID:-}" ]; then
            curl --fail --request POST \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_WORKER_SERVICE_ID/deploys"
          fi

          if [ -n "${RENDER_SCHEDULER_SERVICE_ID:-}" ]; then
            curl --fail --request POST \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SCHEDULER_SERVICE_ID/deploys"
          fi
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
          RENDER_SCHEDULER_SERVICE_ID: ${{ secrets.RENDER_SCHEDULER_SERVICE_ID }}

  post-deploy-healthcheck:
    name: Post-deploy healthcheck
    runs-on: ubuntu-latest
    needs:
      - deploy-frontend
      - deploy-backend
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop' || startsWith(github.event.workflow_run.head_branch, 'release/')))

    steps:
      - name: Check backend health
        run: |
          set -eu
          if [ -z "${PUBLIC_API_BASE_URL:-}" ]; then
            echo "PUBLIC_API_BASE_URL is not configured; skipping external healthcheck."
            exit 0
          fi

          python - <<'PY'
          import os
          import urllib.request

          base_url = os.environ["PUBLIC_API_BASE_URL"].rstrip("/")
          urllib.request.urlopen(base_url + "/api/health", timeout=20)
          urllib.request.urlopen(base_url + "/api/readiness", timeout=20)
          PY
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
