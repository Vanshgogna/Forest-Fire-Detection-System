name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  DATABASE_URL: postgresql+psycopg://firesight:firesight@localhost:5432/firesight
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python for shared checks
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Formatting check
        run: python scripts/check-format.py

      - name: Unit and smoke tests
        run: npm test

      - name: Build verification
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: firesight
          POSTGRES_PASSWORD: firesight
          POSTGRES_DB: firesight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firesight -d firesight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install ruff==0.8.4 bandit==1.7.10 pip-audit==2.7.3

      - name: Lint backend
        run: ruff check --select E9,F63,F7,F82 backend tests

      - name: Formatting check
        run: python scripts/check-format.py

      - name: Compile backend modules
        run: python -m compileall backend

      - name: Unit and integration tests
        run: python -m pytest

      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt

      - name: Security scan
        run: bandit -r backend -ll

  docker:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: firesight-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Repository security scan
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - docker
      - security

    steps:
      - name: Confirm deployable build
        run: echo "All CI quality gates passed."
