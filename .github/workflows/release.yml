name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example v0.2.0
        required: true

permissions:
  contents: write
  packages: write

env:
  ENVIRONMENT: test
  DATABASE_URL: postgresql+psycopg://firesight:firesight@localhost:5432/firesight
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "$VERSION" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

      - name: Confirm changelog entry exists
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          grep -F "## [${VERSION#v}]" CHANGELOG.md

  build-release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: validate-release

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: firesight
          POSTGRES_PASSWORD: firesight
          POSTGRES_DB: firesight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firesight -d firesight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Verify frontend
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Verify backend
        run: |
          python -m compileall backend
          python -m pytest

      - name: Create source archive
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          git archive --format zip --output "firesight-${VERSION}.zip" HEAD

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: firesight-*.zip
          if-no-files-found: error

  docker-release:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: validate-release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/firesight-api:${{ github.event.inputs.version || github.ref_name }}
            ghcr.io/${{ github.repository }}/firesight-api:latest

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-release
      - docker-release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: firesight-*.zip
